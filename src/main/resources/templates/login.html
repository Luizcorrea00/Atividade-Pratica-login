<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Seguro</title>
<link rel="stylesheet" th:href="@{/css/base.css}">
<link rel="stylesheet" th:href="@{'/css/themes/' + ${theme} + '.css'}">
</head>
<body>
<header>
<a href="/dashboard">NÚCLEO / Acesso seguro</a>
<nav sec:authorize="isAuthenticated()">
<a href="/dashboard">Início</a>
<a sec:authorize="hasAnyRole('MANAGER','ADMIN')" href="/manager">Gestão</a>
<a sec:authorize="hasRole('ADMIN')" href="/admin/users">Usuários</a>
<form th:action="@{/logout}" method="post">
<button>Sair</button>
</form>
</nav>
</header>
<main>
<section class="card narrow">
<p class="eyebrow">BEM-VINDO</p>
<h1>Seu espaço começa aqui.</h1>
<p>Acesse sua conta para continuar.</p>
<p role="alert" th:if="${param.error}">E-mail ou senha inválidos.</p>
<p th:if="${param.logout}">Sessão encerrada.</p>
<p th:if="${param.expired}">Acesso atualizado. Entre novamente.</p>
<p th:if="${param.registered}">Cadastro concluído.</p>
<form th:action="@{/login}" method="post">
<label>E-mail<input name="username" type="email" autocomplete="username" required maxlength="254">
</label>
<label>Senha<input name="password" type="password" autocomplete="current-password" required>
</label>
<button>Entrar</button>
</form>
<a href="/register">Criar uma conta</a>
</section>
</main>
<footer>Base modular para novos projetos · Java + Spring</footer>
</body>
</html>
