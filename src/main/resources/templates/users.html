<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Seguro</title>
<link rel="stylesheet" th:href="@{/css/base.css}">
<link rel="stylesheet" th:href="@{'/css/themes/' + ${theme} + '.css'}">
</head>
<body>
<header>
<a href="/dashboard">NÚCLEO / Acesso seguro</a>
<nav sec:authorize="isAuthenticated()">
<a href="/dashboard">Início</a>
<a sec:authorize="hasAnyRole('MANAGER','ADMIN')" href="/manager">Gestão</a>
<a sec:authorize="hasRole('ADMIN')" href="/admin/users">Usuários</a>
<form th:action="@{/logout}" method="post">
<button>Sair</button>
</form>
</nav>
</header>
<main>
<h1>Controle de usuários</h1>
<p th:if="${param.self}" role="alert">Sua própria conta não pode ser alterada aqui.</p>
<p th:if="${param.invalid}" role="alert">Dados inválidos.</p>
<section class="card" th:each="u : ${users}">
<p th:text="${u.email}">
</p>
<form th:action="@{/admin/users/{id}(id=${u.id})}" method="post">
<label>Nome<input name="name" th:value="${u.name}" minlength="2" maxlength="80" required>
</label>
<label>Perfil<select name="role">
<option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}">
</option>
</select>
</label>
<label>
<input type="checkbox" name="enabled" value="true" th:checked="${u.enabled}"> Conta ativa</label>
<button>Salvar alterações</button>
</form>
<form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post">
<button class="danger">Excluir usuário definitivamente</button>
</form>
</section>
</main>
<footer>Base modular para novos projetos · Java + Spring</footer>
</body>
</html>
